# Usign the Clean Blog theme

title: Homepage of Gabriel Peyré
author: Gabriel Peyré
email: gabriel.peyre@ens.fr
description: Homepage of Gabriel Peyré
baseurl: ""
url: "https://www.gpeyre.com"
github_username:  gpeyre
twitter_username: gabrielpeyre

# Build settings
markdown: kramdown
permalink: pretty
paginate: 5
# Keep deliberately future-dated posts visible when publishing them.
future: true
# Forthcoming articles are public static previews; exclude their authoring notes.
exclude: ["node_modules", "blog/blog-todo.md", "blog/README.md", "blog/announcement-queue.md", "blog/announcement-queue.html", "css/blog-queue.css", "js/blog-queue.js", "blog/published.md", "blog/publication-log.json", "blog/.publication-run.lock", "blog/ideas", "blog/preparations/README.md", "tests", "scripts"]

defaults:
  - scope:
      path: "blog"
      type: "posts"
    values:
      layout: blog-post
      blog: true
      author: Gabriel Peyré
      category: blog
      permalink: /blog/:year/:month/:day/:title/
      excerpt_separator: "<!--more-->"

name: Gabriel Peyré, recent works
gems:
  - jekyll-feed
  - jekyll-paginate
