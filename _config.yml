# Usign the Clean Blog theme

title: Homepage of Gabriel Peyré
author: Gabriel Peyré
email: gabriel.peyre@ens.fr
description: Homepage of Gabriel Peyré
baseurl: ""
url: "http://www.gpeyre.com"
github_username:  gpeyre
twitter_username: gabrielpeyre

# Build settings
markdown: kramdown
permalink: pretty
paginate: 5
exclude: ["node_modules", "blog/blog-todo.md", "blog/README.md", "tests"]

defaults:
  - scope:
      path: "blog"
      type: "posts"
    values:
      layout: blog-post
      blog: true
      author: Gabriel Peyré
      category: blog
      permalink: /blog/:year/:month/:day/:title/
      excerpt_separator: "<!--more-->"

name: Gabriel Peyré, recent works
gems:
  - jekyll-feed
  - jekyll-paginate
